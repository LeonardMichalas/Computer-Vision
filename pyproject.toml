[project]
name = "classic-cv"
version = "1.0.0"
description = "Classic computer vision algorithms implemented from scratch: histogram equalisation, convolution, Sobel edge detection and the Hough transform."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Leonard Michalas" }]
keywords = ["computer-vision", "image-processing", "convolution", "sobel", "hough-transform", "histogram-equalization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=2.1",
    "opencv-python>=4.10",
    "matplotlib>=3.9",
    "pillow>=11.0",
]

[project.urls]
Homepage = "https://github.com/LeonardMichalas/Computer-Vision"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classic_cv"]

# --- Lint and format -------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "assignments"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF"]
ignore = ["S101"]

# --- Types -----------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["cv2.*", "matplotlib.*"]
ignore_missing_imports = true

# --- Tests -----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
